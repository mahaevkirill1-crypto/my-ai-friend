<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ИИ-Друг</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: #0d1117; 
            --bot-msg-bg: #1c2533; 
            --user-msg-bg: #2b5278; 
            --text-color: #ffffff;
            --accent-color: #58a6ff; 
            --user-color: #2b5278;
        }

        * { box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: radial-gradient(circle at top, #1a2433 0%, var(--bg-color) 100%);
            color: var(--text-color);
            margin: 0; padding: 0;
            display: flex; flex-direction: column; height: 100vh; overflow: hidden;
        }

        /* Верхняя часть с роботом */
        #top-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: flex-end; /* Прижимаем всё к низу этой зоны */
            align-items: center;
           %;
 position: relative;
            padding-top: 20px;
                       padding-bottom: 10px;
            min width-height: 35vh;
        }

        .:character-container {
            position: relative;
            display: flex 100;
            flex-direction: column;
            align-items: center;
            max-width: 95%;
        }

        .character-img {
            width: 240px; 
            max-width: 70vw;
            height: auto;
            filter: drop-shadow(0 15px 25px rgba(88, 166, 255, 0.2));
            transition: opacity 0.3s ease;
            animation: float 4s ease-in-out infinite;
            flex-shrink: 0; /* Запрещаем картинке сжиматься */
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        /* Облачко */
        .speech-bubble {
            background: rgba(28, 37, 51, 0.85);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid var(--accent-color);
            color: #e6edf3;
            padding: 12px 18px;
            border-radius: 16px;
            border-bottom-left-radius: 4px;
            font-size: 15px;
            line-height: 1.4;
            margin-bottom: 15px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.5);
            display: none;
            animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
            position: relative;
            z-index: 10;
            max-width: 95%;
            word-wrap: break-word;
            /* Ограничиваем высоту облачка, чтобы оно не выталкивало робота */
            max-height: 30vh; 
            overflow-y: auto;
        }

        .speech-bubble.user-bubble {
            border-color: var(--user-color);
            border-bottom-left-radius: 16px;
            border-bottom-right-radius: 4px;
            background: rgba(43, 82, 120, 0.85);
        }

        .speech-bubble::after {
            content: '';
            position: absolute;
            bottom: -8px; left: 20px;
            width: 16px; height: 16px;
            background: rgba(28, 37, 51, 0.85);
            border-bottom: 1px solid var(--accent-color);
            border-left: 1px solid var(--accent-color);
            transform: rotate(-45deg);
        }
        
        .speech-bubble.user-bubble::after {
            background: rgba(43, 82, 120, 0.85);
            border-color: var(--user-color);
            left: auto; right: 20px;
            transform: rotate(45deg);
        }

        @keyframes popIn {
            0% { opacity: 0; transform: scale(0.9) translateY(15px); }
            100% { opacity: 1; transform: scale(1) translateY(0); }
        }

        /* История чата */
        #chat-history {
            flex: 0.8;
            overflow-y: auto;
            padding: 10px 16px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            z-index: 20;
            mask-image: linear-gradient(to bottom, transparent, black 10%, black 90%, transparent);
            -webkit-mask-image: linear-gradient(to bottom, transparent, black 10%, black 90%, transparent);
        }

        .msg-row {
            display: flex; align-items: flex-end; gap: 8px; max-width: 85%;
            animation: slideIn 0.3s ease-out forwards; opacity: 0; transform: translateY(10px);
        }
        .msg-row.user { align-self: flex-end; flex-direction: row-reverse; }
        .msg-row.bot { align-self: flex-start; }
        @keyframes slideIn { to { opacity: 1; transform: translateY(0); } }

        .avatar {
            width: 26px; height: 26px; border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 14px; background: var(--bot-msg-bg); flex-shrink: 0;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .msg-row.user .avatar { background: var(--user-msg-bg); }
        .message { padding: 10px 14px; border-radius: 16px; font-size: 14px; line-height: 1.4; word-wrap: break-word; }
        .msg-row.user .message { background-color: var(--user-msg-bg); border-bottom-right-radius: 4px; }
        .msg-row.bot .message { background-color: var(--bot-msg-bg); border-bottom-left-radius: 4px; }

        /* --- HUD Интерфейс (внизу) --- */
        #hud-panel {
            padding: 16px;
            background: var(--bg-color);
            display: flex;
            flex-direction: column;
            gap: 12px;
            z-index: 20;
            padding-bottom: max(16px, env(safe-area-inset-bottom));
            flex-shrink: 0;
            border-top: 1px solid rgba(255,255,255,0.05);
        }

        .input-wrapper {
            display: flex; align-items: center; gap: 10px;
        }

        .mic-btn {
            width: 44px; height: 44px; border-radius: 10px;
            background: transparent; border: 1px solid rgba(88, 166, 255, 0.3);
            color: var(--accent-color); display: flex; justify-content: center; align-items: center;
            font-size: 18px; cursor: pointer;
        }

        .input-container {
            flex: 1; display: flex; align-items: center;
            background: #0d1117; border: 1px solid var(--accent-color);
            border-radius: 8px; position: relative;
            clip-path: polygon(10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%, 0 10px);
            padding: 4px;
        }

        #user-input {
            flex: 1; background: transparent; border: none;
            color: #fff; padding: 10px 12px; font-size: 15px; outline: none;
        }

        #send-btn {
            width: 40px; height: 40px; background: var(--accent-color);
            border: none; border-radius: 6px; color: #000; font-size: 18px;
            display: flex; justify-content: center; align-items: center;
            cursor: pointer; margin-right: 2px;
        }
    </style>
</head>
<body>
    <!-- Верхняя зона с роботом -->
    <div id="top-area">
        <div class="character-container">
            <div class="speech-bubble" id="speech-bubble"></div>
            <img src="IMG_1209.png?v=5" alt="Robot" class="character-img" id="character-img">
        </div>
    </div>

    <!-- История чата -->
    <div id="chat-history"></div>

    <!-- НИЖНЯЯ ПАНЕЛЬ (HUD) -->
    <div id="hud-panel">
        <div class="input-wrapper">
            <button class="mic-btn">🎤</button>
            <div class="input-container">
                <input type="text" id="user-input" placeholder="Напиши сообщение..." autocomplete="off">
                <button id="send-btn">➤</button>
            </div>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();
        tg.setHeaderColor('#0d1117');
        tg.setBackgroundColor('#0d1117');

        const input = document.getElementById('user-input');
        const sendBtn = document.getElementById('send-btn');
        const speechBubble = document.getElementById('speech-bubble');
        const characterImg = document.getElementById('character-img');
        const chatHistory = document.getElementById('chat-history');

        const BACKEND_URL = 'https://ai-friend-brain.onrender.com';
        let isSending = false;

        function showBubble(text, isUser = false) {
            speechBubble.style.display = 'block';
            speechBubble.className = `speech-bubble ${isUser ? 'user-bubble' : ''}`;
            speechBubble.style.animation = 'none';
            void speechBubble.offsetWidth;
            speechBubble.style.animation = 'popIn 0.3s forwards';
            speechBubble.textContent = '';
            
            if (isUser) {
                speechBubble.textContent = text;
            } else {
                let i = 0;
                function typeWriter() {
                    if (i < text.length) {
                        speechBubble.textContent += text.charAt(i);
                        i++;
                        speechBubble.scrollTop = speechBubble.scrollHeight; // Автоскролл внутри облачка
                        setTimeout(typeWriter, 20);
                    }
                }
                typeWriter();
            }
        }

        function addToHistory(text, sender) {
            const row = document.createElement('div');
            row.className = `msg-row ${sender}`;
            const avatar = document.createElement('div');
            avatar.className = 'avatar';
            avatar.textContent = sender === 'user' ? '👤' : '🤖';
            const msg = document.createElement('div');
            msg.className = 'message';
            msg.textContent = text;
            row.appendChild(avatar);
            row.appendChild(msg);
            chatHistory.appendChild(row);
            chatHistory.scrollTop = chatHistory.scrollHeight;
        }

        async function sendMessage(text) {
            if (!text || isSending) return;
            isSending = true;

            showBubble(text, true);
            addToHistory(text, 'user');
            input.value = '';
            input.disabled = true;
            sendBtn.disabled = true;
            characterImg.style.opacity = '0.5';

            setTimeout(async () => {
                try {
                    const response = await fetch(`${BACKEND_URL}/ask`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ text: text })
                    });

                    if (!response.ok) throw new Error(`Сервер ответил: ${response.status}`);
                    
                    const data = await response.json();
                    
                    characterImg.style.opacity = '1';
                    showBubble(data.text, false); 
                    addToHistory(data.text, 'bot');

                } catch (error) {
                    characterImg.style.opacity = '1';
                    showBubble(`Ошибка: ${error.message}`, false);
                    addToHistory(`Ошибка: ${error.message}`, 'bot');
                } finally {
                    input.disabled = false;
                    sendBtn.disabled = false;
                    input.focus();
                    isSending = false; 
                }
            }, 800);
        }

        sendBtn.addEventListener('click', () => sendMessage(input.value.trim()));
        input.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendMessage(input.value.trim());
        });

        setTimeout(() => showBubble("Привет! Как дела?"), 500);
    </script>
</body>
</html>
