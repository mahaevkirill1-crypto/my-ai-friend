<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ИИ-Друг</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: #0d1117; /* Глубокий темный фон */
            --bot-msg-bg: #1c2533; 
            --user-msg-bg: #2b5278; 
            --text-color: #ffffff;
            --input-bg: #1c2533;
            --hint-color: #8b949e;
            --accent-color: #58a6ff; /* Голубой цвет робота */
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: radial-gradient(circle at top, #1a2433 0%, var(--bg-color) 100%);
            color: var(--text-color);
            margin: 0; padding: 0;
            display: flex; flex-direction: column; height: 100vh; box-sizing: border-box;
            overflow: hidden;
        }

        /* Зона с персонажем */
        #character-area {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            padding-top: 20px;
        }

        /* Контейнер для робота, чтобы он парил */
        .character-container {
            position: relative;
            animation: float 4s ease-in-out infinite;
            display: flex;
            flex-direction: column;
            align-items: center;
            max-width: 90%;
        }

        /* Анимация левитации (парения) */
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }

        /* Сама картинка робота */
        .character-img {
            width: 250px; /* Размер подогнан под телефон */
            max-width: 80vw;
            height: auto;
            filter: drop-shadow(0 15px 25px rgba(88, 166, 255, 0.2));
            transition: opacity 0.3s ease;
        }

        /* Облачко с сообщением (как на референсе) */
        .speech-bubble {
            background-color: rgba(28, 37, 51, 0.9);
            border: 1px solid var(--accent-color);
            color: white;
            padding: 12px 18px;
            border-radius: 20px;
            border-bottom-left-radius: 4px;
            font-size: 15px;
            margin-bottom: 20px;
            max-width: 100%;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            backdrop-filter: blur(5px);
            display: none; /* По умолчанию скрыто */
            animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        @keyframes popIn {
            0% { opacity: 0; transform: scale(0.9) translateY(10px); }
            100% { opacity: 1; transform: scale(1) translateY(0); }
        }

        /* История чата (внизу экрана) */
        #chat-history {
            height: 30vh;
            overflow-y: auto;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            background: linear-gradient(0deg, var(--bg-color) 80%, transparent 100%);
        }

        .message {
            padding: 10px 14px;
            border-radius: 16px;
            max-width: 80%;
            font-size: 14px;
            line-height: 1.4;
            animation: slideIn 0.3s ease-out forwards;
            opacity: 0;
            transform: translateY(10px);
        }

        @keyframes slideIn { to { opacity: 1; transform: translateY(0); } }

        .message.user {
            background-color: var(--user-msg-bg);
            align-self: flex-end;
            border-bottom-right-radius: 4px;
        }

        .message.bot {
            background-color: var(--bot-msg-bg);
            align-self: flex-start;
            border-bottom-left-radius: 4px;
        }

        /* Зона ввода */
        #input-area {
            display: flex;
            gap: 10px;
            padding: 12px 16px;
            background-color: var(--bg-color);
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            padding-bottom: max(12px, env(safe-area-inset-bottom));
        }

        #user-input {
            flex: 1;
            padding: 12px 16px;
            border-radius: 20px;
            border: 1px solid rgba(88, 166, 255, 0.2);
            background: var(--input-bg);
            color: var(--text-color);
            font-size: 15px;
            outline: none;
            transition: border 0.3s;
        }

        #user-input:focus {
            border: 1px solid var(--accent-color);
        }

        #send-btn {
            padding: 0 20px;
            border-radius: 20px;
            border: none;
            background: var(--accent-color);
            color: #000;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.1s;
        }
        #send-btn:active { transform: scale(0.95); }
    </style>
</head>
<body>
    <!-- Зона с роботом -->
    <div id="character-area">
        <div class="character-container">
            <!-- Облачко для последнего ответа -->
            <div class="speech-bubble" id="speech-bubble"></div>
            
            <!-- Картинка робота с твоим точным именем файла -->
            <img src="IMG_1204.jpeg" alt="Robot" class="character-img" id="character-img">
        </div>
    </div>

    <!-- История чата -->
    <div id="chat-history"></div>

    <!-- Ввод -->
    <div id="input-area">
        <input type="text" id="user-input" placeholder="Напиши сообщение..." autocomplete="off">
        <button id="send-btn">➤</button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();
        tg.setHeaderColor('#0d1117');
        tg.setBackgroundColor('#0d1117');

        const chatHistory = document.getElementById('chat-history');
        const input = document.getElementById('user-input');
        const sendBtn = document.getElementById('send-btn');
        const speechBubble = document.getElementById('speech-bubble');
        const characterImg = document.getElementById('character-img');

        const BACKEND_URL = 'https://ai-friend-brain.onrender.com';

        // Функция для облачка с печатной машинкой
        function showBubble(text) {
            speechBubble.style.display = 'block';
            speechBubble.textContent = '';
            let i = 0;
            function typeWriter() {
                if (i < text.length) {
                    speechBubble.textContent += text.charAt(i);
                    i++;
                    setTimeout(typeWriter, 30); // Скорость печати
                }
            }
            typeWriter();
        }

        // Функция для добавления в историю (внизу)
        function addToHistory(text, sender) {
            const div = document.createElement('div');
            div.className = `message ${sender}`;
            div.textContent = text;
            chatHistory.appendChild(div);
            chatHistory.scrollTop = chatHistory.scrollHeight;
        }

        async function sendMessage() {
            const text = input.value.trim();
            if (!text) return;

            addToHistory(text, 'user');
            input.value = '';
            input.disabled = true;
            sendBtn.disabled = true;
            
            // Робот "думает" - делаем его полупрозрачным
            characterImg.style.opacity = '0.4';

            try {
                const response = await fetch(`${BACKEND_URL}/ask`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ text: text })
                });

                if (!response.ok) throw new Error(`Сервер ответил: ${response.status}`);
                
                const data = await response.json();
                
                // Робот "оживает" и говорит
                characterImg.style.opacity = '1';
                showBubble(data.text); 
                addToHistory(data.text, 'bot');

            } catch (error) {
                characterImg.style.opacity = '1';
                showBubble(`Ошибка: ${error.message}`);
                addToHistory(`Ошибка: ${error.message}`, 'bot');
            } finally {
                input.disabled = false;
                sendBtn.disabled = false;
                input.focus();
            }
        }

        sendBtn.addEventListener('click', sendMessage);
        input.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendMessage();
        });

        // Приветствие при загрузке
        setTimeout(() => showBubble("Привет! Как дела?"), 500);
    </script>
</body>
</html>
