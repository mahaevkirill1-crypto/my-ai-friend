<!doctype html>
<html lang="ru" data-v="hack">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1.0,user-scalable=no">
<title>Голограмма-бот</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
    :root { --bg-color: #0E1726; --bot-msg-bg: #1c2533; --user-msg-bg: #2b5278; --text-color: #ffffff; --accent-color: #4FD1E8; }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: var(--bg-color); color: #C8F8FF; font: 15px/1.4 system-ui, -apple-system, sans-serif; overflow: hidden; }
    body { display: flex; flex-direction: column; align-items: center; position: fixed; top: 0; left: 0; width: 100%; height: var(--app-h, 100vh); padding-top: 6px; overscroll-behavior: none; }
    
    #topbar { width: 100%; max-width: 450px; padding: 0 16px; display: flex; justify-content: flex-end; gap: 8px; position: relative; z-index: 40; flex-shrink: 0; }
    .ibtn { width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; background: #0B2230; border: 1px solid rgba(79,209,232,.4); border-radius: 8px; color: #9AF0FF; cursor: pointer; padding: 0; position: relative; }
    .ibtn:active { background: #123A4A; }
    .ibtn.danger { color: #FF9E9E; }
    .ibtn.muted { color: #4B8FA0; }
    
    #chat-history { flex: 1; width: 100%; max-width: 450px; overflow-y: auto; padding: 10px 16px; display: flex; flex-direction: column; gap: 10px; z-index: 20; padding-bottom: 150px; }
    .msg-row { display: flex; align-items: flex-end; gap: 8px; max-width: 88%; }
    .msg-row.user { align-self: flex-end; flex-direction: row-reverse; }
    .msg-row.bot { align-self: flex-start; }
    .avatar { width: 28px; height: 28px; flex-shrink: 0; display: flex; justify-content: center; align-items: center; font-size: 14px; background: #4FD1E8; color: #0E1726; border-radius: 50%; }
    .msg-row.user .avatar { background: #2b5278; color: #EAF6FF; }
    .col { min-width: 0; } .lbl { font-size: 10px; color: #4B8FA0; margin: 0 0 3px 2px; text-transform: uppercase; } .msg-row.user .lbl { text-align: right; }
    .message { padding: 9px 13px; font-size: 14px; line-height: 1.45; color: #E8FBFF; word-wrap: break-word; }
    .msg-row.user .message { background: #163B57; border: 1px solid #4FD1E8; border-radius: 14px 4px 4px 14px; }
    .msg-row.bot .message { background: #10202F; border: 1px solid #2E8FA3; border-radius: 4px 14px 14px 4px; }
    .tm { font-size: 10px; color: #4B8FA0; margin: 3px 2px 0; text-align: right; }

    #hud-panel { padding: 12px 16px; width: 100%; max-width: 450px; background: var(--bg-color); display: flex; z-index: 20; flex-shrink: 0; border-top: 1px solid rgba(255,255,255,0.05); position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); flex-direction: column; }
    #chips { display: flex; gap: 6px; margin-bottom: 10px; overflow-x: auto; }
    .chip { flex: none; font-size: 12px; color: #9AF0FF; background: #0B2230; border: 1px solid #2E8FA3; border-radius: 4px; padding: 5px 11px; cursor: pointer; }
    .input-container { width: 100%; background: #4FD1E8; padding: 1px; border-radius: 4px; }
    .input-inner { display: flex; align-items: center; gap: 8px; background: #0d1117; padding: 4px 4px 4px 14px; border-radius: 4px; }
    #user-input { flex: 1; background: transparent; border: none; color: #fff; padding: 10px 0; font-size: 16px; outline: none; }
    #send-btn { width: 40px; height: 40px; flex-shrink: 0; background: #4FD1E8; border: none; color: #0E1726; display: flex; justify-content: center; align-items: center; cursor: pointer; border-radius: 4px; }

    .overlay { position: fixed; inset: 0; display: none; background: var(--bg-color); z-index: 50; flex-direction: column; }
    .overlay.open { display: flex; }
    #shop-head { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; border-bottom: 1px solid rgba(255,255,255,0.05); }
    #shop-head h2 { margin: 0; font-size: 17px; color: #fff; }
    .bal { font-size: 14px; color: #FFD166; margin-left: auto; margin-right: 12px; font-weight: 500; }
    .txtbtn { background: #0B2230; border: 1px solid #2E8FA3; color: #9AF0FF; font-size: 13px; border-radius: 4px; padding: 6px 12px; cursor: pointer; }
    .txtbtn.on { border-color: #FFD166; color: #FFD166; }
    #shop-tabs { display: flex; gap: 8px; padding: 12px 16px 0; border-bottom: 1px solid rgba(255,255,255,0.05); overflow-x: auto; }
    #shop-list { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
    .pane { flex: 1; overflow-y: auto; padding: 16px; display: none; flex-direction: column; gap: 12px; }
    
    .card { background: #0B2230; border: 1px solid #2E8FA3; border-radius: 12px; padding: 12px; display: flex; gap: 12px; align-items: center; }
    .info { flex: 1; min-width: 0; }
    .name { font-weight: 500; color: #fff; font-size: 15px; }
    .desc { font-size: 12px; color: #7FE5F5; margin: 4px 0 8px; line-height: 1.45; }
    .price { color: #FFD166; font-size: 13px; margin-bottom: 8px; }
    .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .gi { background: #0B2230; border: 1px solid #2E8FA3; border-radius: 8px; padding: 10px 6px; text-align: center; font-size: 12px; color: #C8F8FF; cursor: pointer; }
    .gi.sel { border-color: #FFD166; }
    .gi .dot { display: block; width: 14px; height: 14px; border-radius: 50%; margin: 0 auto 6px; }
    .bcard { background: #0B2230; border: 1px solid #2E8FA3; border-radius: 12px; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
    
    #toast { position: fixed; top: 20px; left: 50%; transform: translateX(-50%) translateY(-100px); background: #0B2230; border: 1px solid #2E8FA3; color: #fff; padding: 10px 16px; border-radius: 8px; font-size: 13px; z-index: 100; opacity: 0; transition: all 0.3s; pointer-events: none; }
    #toast.on { transform: translateX(-50%) translateY(0); opacity: 1; }
</style>
</head>
<body>
<div id="topbar">
  <button class="ibtn" id="shop-btn" aria-label="Магазин"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 7h12l1 13H5L6 7z"/><path d="M9 7a3 3 0 0 1 6 0"/></svg></button>
  <button class="ibtn danger" id="clear-btn" aria-label="Удалить чат"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M6 6l1 14h10l1-14"/><path d="M10 11v6M14 11v6"/></svg></button>
</div>
<div id="chat-history"></div>
<div id="hud-panel">
    <div id="chips">
        <button class="chip" data-say="Станцуй">Станцуй</button>
        <button class="chip" data-say="Расскажи шутку">Расскажи шутку</button>
        <button class="chip" data-say="Поиграем">Поиграем</button>
    </div>
    <div class="input-container">
        <div class="input-inner">
            <input type="text" id="user-input" placeholder="Напиши сообщение..." autocomplete="off" maxlength="500">
            <button id="send-btn" aria-label="Отправить"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2 11 13"/><path d="M22 2 15 22l-4-9-9-4 20-7z"/></svg></button>
        </div>
    </div>
</div>

<div id="shop" class="overlay">
  <div id="shop-head">
    <h2>Магазин</h2>
    <span class="bal" id="bal-el">★ 0</span>
    <button class="txtbtn" id="shop-close">Закрыть</button>
  </div>
  <div id="shop-tabs">
    <button class="txtbtn on" data-t="shop">Магазин</button>
    <button class="txtbtn" data-t="cases">Кейсы</button>
    <button class="txtbtn" data-t="inv">Инвентарь</button>
  </div>
  <div id="shop-list" class="pane" style="display:flex">
    <div class="sect">Наряды</div>
    <div class="grid" id="w-grid"></div>
  </div>
  <div id="cases-list" class="pane"></div>
  <div id="inv-list" class="pane"></div>
</div>
<div id="toast"></div>

<script>
const $ = id => document.getElementById(id);
const tg = window.Telegram && Telegram.WebApp;
const BACKEND_URL = 'https://ai-friend-brain.onrender.com';
const store = { get: (k, d) => { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch(e) { return d; } }, set: (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch(e) {} } };

let BAL = store.get('bal', 0);
let OWNED = store.get('owned', {});
let EQUIP = store.get('equip', {});
let isSending = false;
let shopOpen = false;

const byId = {};
const WEAR = [
    {id:'c_pink', slot:'color', name:'Розовый', price:20, sw:'#FF8FC7', c:'#FF8FC7', s:'#FFC2E2'},
    {id:'h_cap', slot:'head', name:'Кепка', price:20, sw:'#FF6B6B', svg:`<path d="M152 106 A38 36 0 0 1 228 106 Z" fill="#FF6B6B" stroke="#FFB3B3" stroke-width="2"/><ellipse cx="190" cy="107" rx="46" ry="7" fill="#D94F4F" stroke="#FFB3B3" stroke-width="1.5"/>`},
    {id:'f_dark', slot:'face', name:'Тёмные очки', price:25, sw:'#0E1726', svg:`<rect x="155" y="123" width="34" height="25" rx="9" fill="#0E1726" stroke="#0E1726" stroke-width="3"/><rect x="191" y="123" width="34" height="25" rx="9" fill="#0E1726" stroke="#0E1726" stroke-width="3"/>`},
    {id:'s_sneak', slot:'feet', name:'Кроссовки', price:30, sw:'#FFFFFF'}
];
WEAR.forEach(w => { byId[w.id] = w; });

const CHAT_ICON = '<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>';

const chatHistory = $('chat-history');

function addToHistory(text, sender) {
    const row = document.createElement('div');
    row.className = 'msg-row ' + sender;
    row.innerHTML = `<div class="avatar">${sender === 'user' ? '👤' : '🤖'}</div><div class="col"><div class="lbl">${sender === 'user' ? 'Ты' : 'Голо-друг'}</div><div class="message">${text}</div></div>`;
    chatHistory.appendChild(row);
    chatHistory.scrollTop = chatHistory.scrollHeight;
}

function toast(s) {
    const t = $('toast');
    t.textContent = s;
    t.classList.add('on');
    setTimeout(() => t.classList.remove('on'), 2500);
}

function renderBal() { $('bal-el').textContent = '★ ' + BAL; }

async function tgPost(path, data) {
    const r = await fetch(`${BACKEND_URL}/${path}`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ init_data: tg.initData, ...data }) });
    return r.json();
}

async function loadProgress() {
    if (!tg || !tg.initData) return;
    try {
        const res = await tgPost('load_progress');
        if (res && res.status === 'ok') {
            BAL = res.bal;
            OWNED = res.owned;
            EQUIP = res.equip;
            store.set('bal', BAL); store.set('owned', OWNED); store.set('equip', EQUIP);
            renderBal();
        }
    } catch(e) { console.error(e); }
}

// --- ЧАТ ---
async function sendMessage(text) {
    if (!text || isSending) return;
    isSending = true;
    addToHistory(text, 'user');
    $('user-input').value = '';
    
    // Секретные команды
    if (text.trim().toLowerCase() === '/admin') {
        addToHistory('Админка пока в разработке.', 'bot'); // Заглушка
        isSending = false; return;
    }

    try {
        const res = await fetch(`${BACKEND_URL}/ask`, {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ text: text, persona: 'hologram', init_data: tg.initData, history: '' })
        });
        const data = await res.json();
        addToHistory(data.text || '...', 'bot');
    } catch(e) {
        addToHistory('Ошибка соединения.', 'bot');
    }
    isSending = false;
}

$('send-btn').addEventListener('click', () => sendMessage($('user-input').value.trim()));
$('user-input').addEventListener('keypress', (e) => { if (e.key === 'Enter') sendMessage($('user-input').value.trim()); });
$('chips').addEventListener('click', e => {
    const b = e.target.closest('button[data-say]');
    if (b) sendMessage(b.dataset.say);
});

// --- МАГАЗИН ---
function renderShop() {
    $('w-grid').innerHTML = WEAR.map(i => {
        const own = !!OWNED[i.id];
        const worn = EQUIP[i.slot] === i.id;
        return `<div class="gi ${worn ? 'sel' : ''}" data').-w="${i.id}"><spanforEach class="dot" style="background:(b${i.sw}"></span>< =>div>${i.name}</div b><div class="${own ? 'own' : 'pr'}">${worn ? 'Надето' : own ? 'Куплено' : '★ ' + i.price}</div></div>`;
    }).join('');
}

$('w-grid').addEventListener('click', async (e) => {
    const c = e.target.closest('.gi');
    if (!c) return;
    const it = byId[c.dataset.w];
    if (!it) return;
    
    if (OWNED[it.id]) {
        // Надеть/снять
        if (EQUIP[it.slot] === it.id) delete EQUIP[it.slot];
        else EQUIP[it.slot] = it.id;
        store.set('equip', EQUIP);
        renderShop();
        syncToServer();
    } else {
        // Купить
        if (BAL >= it.price) {
            BAL -= it.price; store.set('bal', BAL); renderBal();
            OWNED[it.id] = true; store.set('owned', OWNED);
            EQUIP[it.slot] = it.id; store.set('equip', EQUIP);
            renderShop(); syncToServer();
        } else {
            toast('Не хватает звезд');
        }
    }
});

function syncToServer() {
    if (!tg || !tg.initData) return;
    tgPost('save_progress', { bal: BAL, equip: EQUIP }).catch(()=>{});
}

function showTab(t) {
    $('shop-tabs').querySelectorAll('button.classList.toggle('on', b.dataset.t === t));
    $('shop-list').style.display = t === 'shop' ? 'flex' : 'none';
    $('cases-list').style.display = t === 'cases' ? 'flex' : 'none';
    $('inv-list').style.display = t === 'inv' ? 'flex' : 'none';
    
    if (t === 'shop') renderShop();
    if (t === 'inv') renderInv();
    if (t === 'cases') renderCases();
}

$('shop-tabs').addEventListener('click', e => {
    const b = e.target.closest('button[data-t]');
    if (b) showTab(b.dataset.t);
});

function openShop() { shopOpen = true; $('shop').classList.add('open'); showTab('shop'); }
function closeShop() { shopOpen = false; $('shop').classList.remove('open'); }

$('shop-btn').addEventListener('click', openShop);
$('shop-close').addEventListener('click', closeShop);

// --- ИНВЕНТАРЬ ---
function renderInv() {
    const items = WEAR.filter(w => OWNED[w.id]);
    if (!items.length) { $('inv-list').innerHTML = '<div class="bcard">Пусто</div>'; return; }
    $('inv-list').innerHTML = `<div class="grid">${items.map(i => `<div class="gi"><span class="dot" style="background:${i.sw}"></span><div>${i.name}</div></div>`).join('')}</div>`;
}

// --- КЕЙСЫ ---
function renderCases() {
    $('cases-list').innerHTML = '<div class="bcard">Кейсы временно недоступны (в разработке).</div>';
}

// --- СТАРТ ---
if (tg) {
    tg.ready(); tg.expand();
    loadProgress();
}
addToHistory('Привет! Я твой голо-друг. Давай поболтаем?', 'bot');
</script>
</body>
</html>
