<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ИИ-Друг</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: #0d1117; 
            --bot-msg-bg: #1c2533; 
            --user-msg-bg: #2b5278; 
            --text-color: #ffffff;
            --input-bg: #1c2533;
            --hint-color: #8b949e;
            --accent-color: #58a6ff; 
        }

        * { box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: radial-gradient(circle at top, #1a2433 0%, var(--bg-color) 100%);
            color: var(--text-color);
            margin: 0; padding: 0;
            display: flex; flex-direction: column; height: 100vh; overflow: hidden;
        }

        /* Зона с персонажем */
        #character-area {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            padding-top: 10px;
        }

        .character-container {
            position: relative;
            animation: float 4s ease-in-out infinite;
            display: flex;
            flex-direction: column;
            align-items: center;
            max-width: 90%;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        .character-img {
            width: 260px;
            max-width: 80vw;
            height: auto;
            filter: drop-shadow(0 15px 25px rgba(88, 166, 255, 0.2));
            transition: opacity 0.3s ease;
        }

        /* 1. Стеклянное облачко (Glassmorphism) */
        .speech-bubble {
            background: rgba(28, 37, 51, 0.6);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(88, 166, 255, 0.3);
            color: #e6edf3;
            padding: 14px 20px;
            border-radius: 24px;
            border-bottom-left-radius: 4px;
            font-size: 15px;
            line-height: 1.4;
            margin-bottom: 20px;
            max-width: 100%;
            box-shadow: 0 8px 32px rgba(0,0,0,0.4), inset 0 0 20px rgba(88, 166, 255, 0.05);
            display: none;
            animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
            position: relative;
            z-index: 10;
        }

        /* Хвостик облачка */
        .speech-bubble::after {
            content: '';
            position: absolute;
            bottom: -8px;
            left: 20px;
            width: 16px;
            height: 16px;
            background: rgba(28, 37, 51, 0.6);
            border-bottom: 1px solid rgba(88, 166, 255, 0.3);
            border-left: 1px solid rgba(88, 166, 255, 0.3);
            transform: rotate(-45deg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }

        @keyframes popIn {
            0% { opacity: 0; transform: scale(0.9) translateY(15px); }
            100% { opacity: 1; transform: scale(1) translateY(0); }
        }

        /* 3. История чата с аватарками */
        #chat-history {
            height: 32vh;
            overflow-y: auto;
            padding: 10px 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            background: linear-gradient(0deg, var(--bg-color) 85%, transparent 100%);
            z-index: 20;
        }

        .msg-row {
            display: flex;
            align-items: flex-end;
            gap: 8px;
            max-width: 85%;
            animation: slideIn 0.3s ease-out forwards;
            opacity: 0;
            transform: translateY(10px);
        }

        .msg-row.user {
            align-self: flex-end;
            flex-direction: row-reverse;
        }

        .msg-row.bot {
            align-self: flex-start;
        }

        .avatar {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 16px;
            background: var(--bot-msg-bg);
            flex-shrink: 0;
            border: 1px solid rgba(255,255,255,0.1);
        }
        
        .msg-row.user .avatar {
            background: var(--user-msg-bg);
        }

        .message {
            padding: 10px 14px;
            border-radius: 16px;
            font-size: 14px;
            line-height: 1.4;
            position: relative;
        }

        @keyframes slideIn { to { opacity: 1; transform: translateY(0); } }

        .msg-row.user .message {
            background-color: var(--user-msg-bg);
            border-bottom-right-radius: 4px;
        }

        .msg-row.bot .message {
            background-color: var(--bot-msg-bg);
            border-bottom-left-radius: 4px;
        }

        /* 2. Зона ввода и круглая кнопка */
        #input-area {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px 16px;
            background-color: var(--bg-color);
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            padding-bottom: max(12px, env(safe-area-inset-bottom));
            z-index: 20;
        }

        #user-input {
            flex: 1;
            padding: 14px 18px;
            border-radius: 24px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            background: var(--input-bg);
            color: var(--text-color);
            font-size: 15px;
            outline: none;
            transition: all 0.3s ease;
        }

        #user-input::placeholder { color: var(--hint-color); }

        /* Свечение поля ввода при фокусе */
        #user-input:focus {
            border-color: var(--accent-color);
            box-shadow: 0 0 15px rgba(88, 166, 255, 0.2);
        }

        #send-btn {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            border: none;
            background: var(--accent-color);
            color: #000;
            font-size: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: transform 0.1s, box-shadow 0.3s;
            flex-shrink: 0;
            padding-right: 2px; /* Чтобы иконка ровно стояла */
        }

        #send-btn:active {
            transform: scale(0.9);
            box-shadow: 0 0 20px rgba(88, 166, 255, 0.5);
        }
    </style>
</head>
<body>
    <!-- Зона с роботом -->
    <div id="character-area">
        <div class="character-container">
            <!-- Облачко -->
            <div class="speech-bubble" id="speech-bubble"></div>
            
            <!-- Робот (не забудь про ?v=4 для сброса кэша) -->
            <img src="IMG_1209.png?v=4" alt="Robot" class="character-img" id="character-img">
        </div>
    </div>

    <!-- История чата -->
    <div id="chat-history"></div>

    <!-- Ввод -->
    <div id="input-area">
        <input type="text" id="user-input" placeholder="Напиши сообщение..." autocomplete="off">
        <button id="send-btn">➤</button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();
        tg.setHeaderColor('#0d1117');
        tg.setBackgroundColor('#0d1117');

        const chatHistory = document.getElementById('chat-history');
        const input = document.getElementById('user-input');
        const sendBtn = document.getElementById('send-btn');
        const speechBubble = document.getElementById('speech-bubble');
        const characterImg = document.getElementById('character-img');

        const BACKEND_URL = 'https://ai-friend-brain.onrender.com';

        function showBubble(text) {
            speechBubble.style.display = 'block';
            speechBubble.textContent = '';
            let i = 0;
            function typeWriter() {
                if (i < text.length) {
                    speechBubble.textContent += text.charAt(i);
                    i++;
                    setTimeout(typeWriter, 30);
                }
            }
            typeWriter();
        }

        // 3. Новая функция добавления в историю с аватарками
        function addToHistory(text, sender) {
            const row = document.createElement('div');
            row.className = `msg-row ${sender}`;
            
            const avatar = document.createElement('div');
            avatar.className = 'avatar';
            avatar.textContent = sender === 'user' ? '👤' : '🤖';
            
            const msg = document.createElement('div');
            msg.className = 'message';
            msg.textContent = text;
            
            row.appendChild(avatar);
            row.appendChild(msg);
            chatHistory.appendChild(row);
            
            chatHistory.scrollTop = chatHistory.scrollHeight;
        }

        async function sendMessage() {
            const text = input.value.trim();
            if (!text) return;

            addToHistory(text, 'user');
            input.value = '';
            input.disabled = true;
            sendBtn.disabled = true;
            
            characterImg.style.opacity = '0.5';

            try {
                const response = await fetch(`${BACKEND_URL}/ask`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ text: text })
                });

                if (!response.ok) throw new Error(`Сервер ответил: ${response.status}`);
                
                const data = await response.json();
                
                characterImg.style.opacity = '1';
                showBubble(data.text); 
                addToHistory(data.text, 'bot');

            } catch (error) {
                characterImg.style.opacity = '1';
                showBubble(`Ошибка: ${error.message}`);
                addToHistory(`Ошибка: ${error.message}`, 'bot');
            } finally {
                input.disabled = false;
                sendBtn.disabled = false;
                input.focus();
            }
        }

        sendBtn.addEventListener('click', sendMessage);
        input.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendMessage();
        });

        setTimeout(() => showBubble("Привет! Как дела?"), 500);
    </script>
</body>
</html>
