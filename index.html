<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1.0,user-scalable=no">
<title>Голограмма-бот</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
    :root { --bg-color: #0E1726; --bot-msg-bg: #1c2533; --user-msg-bg: #2b5278; --text-color: #ffffff; --accent-color: #4FD1E8; }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: var(--bg-color); color: #C8F8FF; font: 15px/1.4 system-ui, -apple-system, sans-serif; overflow: hidden; }
    body { display: flex; flex-direction: column; align-items: center; height: 100vh; padding-top: 6px; }
    #topbar { width: 100%; max-width: 450px; padding: 0 16px; display: flex; justify-content: flex-end; gap: 8px; position: relative; z-index: 40; flex-shrink: 0; }
    .ibtn { width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; background: #0B2230; border: 1px solid rgba(79,209,232,.4); border-radius: 8px; color: #9AF0FF; cursor: pointer; padding: 0; position: relative; }
    .ibtn:active { background: #123A4A; }
    .ibtn.danger { color: #FF9E9E; }
    .ibtn.muted { color: #4B8FA0; }
    .ibtn.has::after { content: ''; position: absolute; top: 4px; right: 4px; width: 8px; height: 8px; background: #FF6B6B; border-radius: 50%; }
    #stage { width: 100%; flex: 0 0 34vh; }
    #sv { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 30; pointer-events: none; display: block; touch-action: manipulation; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; --c: #4FD1E8; --s: #9AF0FF; --su: #EEF3FA; --lc: #FFD166; }
    #fly, #astw { pointer-events: visiblePainted; cursor: pointer; }
    .c { fill: var(--c); }
    .s { stroke: var(--s); }
    .su { fill: var(--su); stroke: #AEB9C8; stroke-width: 1.5; }
    .lt { fill: var(--lc); }
    #bub { position: fixed; display: none; transform: translate(-50%, -100%); z-index: 35; background: #0B2230; border: 1px solid #4FD1E8; color: #C8F8FF; font-size: 13px; line-height: 1.4; padding: 6px 10px; border-radius: 10px; max-width: 210px; text-align: center; pointer-events: none; }
    #chat-history { flex: 1; width: 100%; max-width: 450px; overflow-y: auto; padding: 10px 16px; display: flex; flex-direction: column; gap: 10px; z-index: 20; mask-image: linear-gradient(to bottom, transparent, black 5%, black 95%, transparent); -webkit-mask-image: linear-gradient(to bottom, transparent, black 5%, black 95%, transparent); }
    .msg-row { display: flex; align-items: flex-end; gap: 8px; max-width: 85%; animation: slideIn 0.3s ease-out forwards; opacity: 0; transform: translateY(10px); }
    .msg-row.user { align-self: flex-end; flex-direction: row-reverse; }
    .msg-row.bot { align-self: flex-start; }
    @keyframes slideIn { to { opacity: 1; transform: translateY(0); } }
    .avatar { width: 26px; height: 26px; border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 14px; background: var(--bot-msg-bg); flex-shrink: 0; border: 1px solid rgba(255,255,255,0.1); }
    .msg-row.user .avatar { background: var(--user-msg-bg); }
    .message { padding: 10px 14px; border-radius: 16px; font-size: 14px; line-height: 1.4; word-wrap: break-word; max-height: 180px; overflow-y: auto; }
    .message::-webkit-scrollbar { width: 4px; }
    .message::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 4px; }
    .msg-row.user .message { background-color: var(--user-msg-bg); border-bottom-right-radius: 4px; }
    .msg-row.bot .message { background-color: var(--bot-msg-bg); border-bottom-left-radius: 4px; }
    #hud-panel { padding: 12px 16px; width: 100%; max-width: 450px; background: var(--bg-color); display: flex; z-index: 20; padding-bottom: max(16px, env(safe-area-inset-bottom)); flex-shrink: 0; border-top: 1px solid rgba(255,255,255,0.05); }
    .input-container { display: flex; align-items: center; background: #0d1117; border: 1px solid var(--accent-color); border-radius: 8px; clip-path: polygon(10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%, 0 10px); padding: 4px; width: 100%; }
    #user-input { flex: 1; background: transparent; border: none; color: #fff; padding: 10px 12px; font-size: 15px; outline: none; }
    #send-btn { width: 40px; height: 40px; background: var(--accent-color); border: none; border-radius: 6px; color: #000; font-size: 18px; display: flex; justify-content: center; align-items: center; cursor: pointer; margin-right: 2px; flex-shrink: 0; }
    .overlay { position: fixed; inset: 0; display: none; }
    .overlay.open { display: flex; }
    #shop { background: var(--bg-color); flex-direction: column; z-index: 50; }
    #shop-head { display: flex; align-items: center; justify-content: space-between; padding: calc(12px + env(safe-area-inset-top)) 16px 12px; border-bottom: 1px solid rgba(255,255,255,0.05); }
    #shop-head h2 { margin: 0; font-size: 17px; font-weight: 500; color: #fff; }
    .bal { font-size: 14px; color: #FFD166; margin-left: auto; margin-right: 12px; font-weight: 500; }
    .txtbtn { background: #0B2230; border: 1px solid #2E8FA3; color: #9AF0FF; font: inherit; font-size: 13px; border-radius: 4px; padding: 6px 12px; cursor: pointer; position: relative; }
    .txtbtn.on { border-color: #FFD166; color: #FFD166; }
    .txtbtn .dot { display: none; }
    .txtbtn.has .dot { display: block; position: absolute; top: -4px; right: -4px; width: 8px; height: 8px; background: #FF6B6B; border-radius: 50%; }
    #shop-tabs { display: flex; gap: 8px; padding: 12px 16px 0; border-bottom: 1px solid rgba(255,255,255,0.05); }
    #shop-list { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; padding-bottom: calc(24px + env(safe-area-inset-bottom)); }
    .sect { font-size: 13px; color: #4B8FA0; margin: 6px 0 -4px; }
    .hint { font-size: 12px; color: #4B8FA0; line-height: 1.5; }
    .card, .try { background: #0B2230; border: 1px solid #2E8FA3; border-radius: 12px; padding: 12px; display: flex; gap: 12px; align-items: center; }
    .card svg { width: 96px; flex: none; }
    .try svg { width: 100px; flex: none; }
    .info { flex: 1; min-width: 0; }
    .name { font-weight: 500; color: #fff; font-size: 15px; }
    .desc { font-size: 12px; color: #7FE5F5; margin: 4px 0 8px; line-height: 1.45; }
    .price { color: #FFD166; font-size: 13px; margin-bottom: 8px; }
    .info .txtbtn { width: 100%; }
    .tabs { display: flex; gap: 6px; flex-wrap: wrap; }
    .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .gi { background: #0B2230; border: 1px solid #2E8FA3; border-radius: 8px; padding: 10px 6px; text-align: center; font-size: 12px; color: #C8F8FF; cursor: pointer; }
    .gi.sel { border-color: #FFD166; }
    .gi .dot { display: block; width: 14px; height: 14px; border-radius: 50%; margin: 0 auto 6px; }
    .gi .pr { color: #FFD166; margin-top: 2px; }
    .gi .own { color: #7FE5F5; margin-top: 2px; }
    #bonus-list { flex: 1; overflow-y: auto; padding: 16px; display: none; flex-direction: column; gap: 12px; padding-bottom: calc(24px + env(safe-area-inset-bottom)); }
    .bcard { background: #0B2230; border: 1px solid #2E8FA3; border-radius: 12px; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
    .bt { font-weight: 500; color: #fff; font-size: 15px; }
    .bs { font-size: 12px; color: #7FE5F5; line-height: 1.5; }
    .week { display: flex; gap: 6px; justify-content: space-between; }
    .wd { flex: 1; height: 30px; display: flex; align-items: center; justify-content: center; background: rgba(255,255,255,0.05); border-radius: 6px; font-size: 12px; color: #4B8FA0; }
    .wd.f { background: #2E8FA3; color: #fff; }
    .wd.t { border: 1px solid #FFD166; color: #FFD166; }
    .q { display: flex; align-items: center; gap: 12px; padding: 8px 0; border-top: 1px solid rgba(255,255,255,0.05); }
    .qi { flex: 1; }
    .qt { font-size: 13px; color: #fff; margin-bottom: 6px; }
    .bar { height: 6px; background: rgba(255,255,255,0.1); border-radius: 3px; overflow: hidden; margin-bottom: 4px; }
    .bar i { display: block; height: 100%; background: #4FD1E8; transition: width 0.3s; }
    .qr { font-size: 11px; color: #4B8FA0; }
    .q button { width: 80px; flex-shrink: 0; }
    .res { font-size: 13px; color: #FFD166; text-align: center; }
    #toast { position: fixed; top: 20px; left: 50%; transform: translateX(-50%) translateY(-100px); background: #0B2230; border: 1px solid #2E8FA3; color: #fff; padding: 10px 16px; border-radius: 8px; font-size: 13px; z-index: 100; opacity: 0; transition: all 0.3s; pointer-events: none; }
    #toast.on { transform: translateX(-50%) translateY(0); opacity: 1; }
    #confirm { background: rgba(7,12,20,.82); align-items: center; justify-content: center; padding: 16px; z-index: 60; }
    .dialog { background: #0B2230; border: 1px solid #2E8FA3; border-radius: 12px; padding: 16px; width: 100%; max-width: 320px; }
    .dialog h3 { margin: 0 0 6px; font-size: 16px; font-weight: 500; color: #fff; }
    .dialog p { margin: 0 0 12px; font-size: 13px; color: #7FE5F5; line-height: 1.5; }
    .dialog label { display: flex; gap: 8px; align-items: flex-start; font-size: 13px; margin-bottom: 14px; cursor: pointer; }
    .dialog .btns { display: flex; gap: 8px; }
    .dialog .btns button { flex: 1; }
    #do-clear { background: #FF6B6B; border: none; color: #0E1726; font: inherit; font-size: 13px; border-radius: 4px; padding: 8px 12px; cursor: pointer; }
</style>
</head>

<script>
const $ = id => document.getElementById(id);
const tr = (id, v) => $(id).setAttribute('transform', v);
const A = (id, a, v) => $(id).setAttribute(a, v);
const cl = (x, a, b) => Math.max(a, Math.min(b, x));
const R = n => Math.floor(Math.random() * n);
const NS = 'http://www.w3.org/2000/svg';
const mk = (tag, at) => { const e = document.createElementNS(NS, tag); for (const a in at) e.setAttribute(a, at[a]); return e; };
const hex = h => [parseInt(h.slice(1,3),16), parseInt(h.slice(3,5),16), parseInt(h.slice(5,7),16)];
const hsl = (h, s, l) => { const a = s * Math.min(l, 1 - l), f = n => { const k = (n + h / 30) % 12; return Math.round(255 * (l - a * Math.max(-1, Math.min(k - 3, 9 - k, 1)))); }; return [f(0), f(8), f(4)]; };
const svg = $('sv');
const tg = window.Telegram && Telegram.WebApp;
if (tg) { tg.ready(); tg.expand(); try { tg.setHeaderColor('#0E1726'); tg.setBackgroundColor('#0E1726'); } catch(e) {} }
const BACKEND_URL = 'https://ai-friend-brain.onrender.com';
const DEMO_BUY = false;
const store = {
  get(k, d){ try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch(e){ return d; } },
  set(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} }
};

/* ============================================================
   ЗВУКИ
   ============================================================ */
const Snd = (() => {
  const VOL = .6;
  let ctx = null, master = null, nbuf = null, jet = null;
  let on = store.get('sound', true);
  function ac(){ if (!ctx){ const C = window.AudioContext || window.webkitAudioContext; if (!C) return null; ctx = new C(); master = ctx.createGain(); master.gain.value = VOL; master.connect(ctx.destination); nbuf = ctx.createBuffer(1, ctx.sampleRate * 2, ctx.sampleRate); const d = nbuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1; } if (ctx.state === 'suspended') ctx.resume(); return ctx; }

async function sendMessage(text) {
    if (!text || isSending) return;
    isSending = true;

    addToHistory(text, 'user');
    input.value = '';
    input.disabled = true;
    sendBtn.disabled = true;
    Snd.click();
    Quest.add('msg');
    if (text.length >= 50) Quest.add('long');

    // --- СЕКРЕТНАЯ КОМАНДА: Я ТЕБЯ ЛЮБЛЮ ---
    if (text.toLowerCase().includes('я тебя люблю') || text.toLowerCase().includes('люблю тебя')) {
        Hologram.react('surprised', 'cheer', 5000);
        Snd.fanfare();
        addToHistory("Я... я тоже тебя люблю! ❤️", 'bot');
        chatHistoryForServer.push({ sender: 'user', text: text });
        chatHistoryForServer.push({ sender: 'bot', text: "Я... я тоже тебя люблю! ❤️" });
        localStorage.setItem('holo_history', JSON.stringify(chatHistoryForServer));
        
        setTimeout(() => {
            const heartMsg = document.createElement('div');
            heartMsg.className = 'msg-row bot';
            heartMsg.innerHTML = '<div class="avatar">🤖</div><div class="message" style="background: transparent; font-size: 30px;">❤️❤️❤️</div>';
            chatHistory.appendChild(heartMsg);
            chatHistory.scrollTop = chatHistory.scrollHeight;
        }, 1000);

        input.disabled = false; sendBtn.disabled = false; input.focus(); isSending = false;
        return;
    }

    const lowText = text.toLowerCase().trim();
    const apologies = ['прости', 'извини', 'сорри', 'не буду', 'прошу прощения'];
    const isApology = apologies.some(w => lowText.includes(w));
    
    const insultPatterns = [
        /^ты\s+(тупой|тупая|дурак|идиот|глупый|дебил|далбаеб|долбаеб)/i,
        /^(тупой|дурак|идиот|дебил|глупый|далбаеб|долбаеб)$/i
    ];
    const isInsult = insultPatterns.some(regex => regex.test(lowText));

    if (isInsult) {
        isOffended = true;
        store.set('isOffended', true);
        const offendPhrases = [
            "Эй, это было обидно. Я же стараюсь.",
            "Знаешь, мне неприятно это слышать.",
            "Я не ожидал такого. Больно, вообще-то.",
            "Может, хватит? Я ведь тоже чувствую."
        ];
        const reply = offendPhrases[R(offendPhrases.length)];
        Hologram.react('angry', 'idle', 4000);
        Snd.hurt();
        addToHistory(reply, 'bot');
        chatHistoryForServer.push({ sender: 'user', text: text });
        chatHistoryForServer.push({ sender: 'bot', text: reply });
        localStorage.setItem('holo_history', JSON.stringify(chatHistoryForServer));
        input.disabled = false; sendBtn.disabled = false; input.focus(); isSending = false;
        return;
    }

    if (isOffended) {
        if (isApology) {
            isOffended = false;
            store.set('isOffended', false);
            const forgivePhrases = [
                "Ладно, проехали. Что хотел спросить?",
                "Хорошо, мир. Давай не будем ссориться.",
                "Принято. Надеюсь, это в последний раз."
            ];
            const reply = forgivePhrases[R(forgivePhrases.length)];
            Hologram.react('happy', 'wave', 3000);
            addToHistory(reply, 'bot');
            chatHistoryForServer.push({ sender: 'user', text: text });
            chatHistoryForServer.push({ sender: 'bot', text: reply });
            localStorage.setItem('holo_history', JSON.stringify(chatHistoryForServer));
            input.disabled = false; sendBtn.disabled = false; input.focus(); isSending = false;
            return;
        } else {
            const ignorePhrases = [
                "Я всё ещё обижен. Ты так больше не будешь?",
                "Сначала извинись, потом поговорим.",
                "Я не хочу сейчас общаться. Пожалуйста, извинись.",
                "Мне нужно время. Скажи, что ты не будешь так делать."
            ];
            const reply = ignorePhrases[R(ignorePhrases.length)];
            Hologram.react('angry', 'idle', 3000);
            Snd.hurt();
            addToHistory(reply, 'bot');
            chatHistoryForServer.push({ sender: 'user', text: text });
            chatHistoryForServer.push({ sender: 'bot', text: reply });
            localStorage.setItem('holo_history', JSON.stringify(chatHistoryForServer));
            input.disabled = false; sendBtn.disabled = false; input.focus(); isSending = false;
            return;
        }
    }

    if (char === 'astro' && /пришельц|инопланет|нло/i.test(text)){
        invade();
        input.disabled = false; sendBtn.disabled = false; input.focus(); isSending = false;
        return;
    }

    if (char === 'astro') say('Слушаю звёзды…', 20000);
    else Hologram.react('thinking', 'think');

    const historyText = chatHistoryForServer.slice(-40).map(m => `${m.sender === 'user' ? 'Пользователь' : 'Ты'}: ${m.text}`).join('\n');

    try {
        const response = await fetch(`${BACKEND_URL}/ask`, {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                text: text,
                persona: char === 'astro' ? 'astronaut' : 'hologram',
                history: historyText,
                user_id: userId()
            })
        });

        if (!response.ok) throw new Error(`Сервер ответил: ${response.status}`);
        const data = await response.json();

        if (char === 'astro') {
            hideBubble();
            if (data.action === 'aliens') invade();
        } else if (data.action === 'dance') {
            Hologram.dance(data.dance_name || 'floss', 5000);
            Quest.add('dance');
        } else {
            let pose = 'idle';
            if (data.emotion === 'happy') { pose = 'wave'; Quest.add('happy'); }
            if (data.emotion === 'surprised') pose = 'cheer';
            Hologram.react(data.emotion, pose, 4000);
        }

        addToHistory(data.text, 'bot');
        chatHistoryForServer.push({ sender: 'user', text: text });
        chatHistoryForServer.push({ sender: 'bot', text: data.text });
        localStorage.setItem('holo_history', JSON.stringify(chatHistoryForServer));

    } catch (error) {
        if (char === 'astro') hideBubble(); else Hologram.react('sad', 'idle');
        addToHistory(`Ошибка: ${error.message}`, 'bot');
    } finally {
        input.disabled = false;
        sendBtn.disabled = false;
        input.focus();
        isSending = false; 
    }
}

  { id: 'msg5',   type: 'msg',   n: 5,  r: 1, t: 'Отправь 5 сообщений' },
  { id: 'long',   type: 'long',  n: 2,  r: 2, t: 'Напиши 2 длинных сообщения (от 50 символов)' },
  { id: 'annoy',  type: 'annoy', n: 3,  r: 2, t: 'Нажми на героя 3 раза: пусть обидится' },
  { id: 'happy',  type: 'happy', n: 3,  r: 2, t: 'Порадуй голо-друга: получи 3 радостных ответа' },
  { id: 'shop',   type: 'shop',  n: 1,  r: 1, t: 'Загляни в магазин' },
  { id: 'try',    type: 'try',   n: 3,  r: 1, t: 'Примерь 3 наряда в магазине' },
  { id: 'buy',    type: 'buy',   n: 1,  r: 6, t: 'Купи любую вещь в магазине' },
  { id: 'fight',  type: 'fight', n: 1,  r: 5, t: 'Победи пришельцев (нужен космонавт)', need: () => !!OWNED.astro }
];
const QDEF = {}; QUESTS.forEach(q => { QDEF[q.id] = q; });
function ensureQuests(){ const d = todayStr(); if (Q && Q.date === d && Q.list.every(id => QDEF[id])) return; const r = rng(hash(d)); const pool = QUESTS.filter(q => !q.need || q.need()); for (let i = pool.length - 1; i > 0; i--){ const j = Math.floor(r() * (i + 1)); [pool[i], pool[j]] = [pool[j], pool[i]]; } const list = [], seen = {}; for (const q of pool){ if (!seen[q.type]){ seen[q.type] = 1; list.push(q.id); if (list.length === 3) break; } } Q = { date: d, list, prog: {}, claimed: {} }; store.set('quests', Q); }
const questReady = () => { ensureQuests(); return Q.list.some(id => (Q.prog[id] || 0) >= QDEF[id].n && !Q.claimed[id]); };
const Quest = { add(type, n = 1){ ensureQuests(); let changed = false; Q.list.forEach(id => { const d = QDEF[id], before = Q.prog[id] || 0; if (d.type !== type || Q.claimed[id] || before >= d.n) return; Q.prog[id] = Math.min(d.n, before + n); changed = true; if (Q.prog[id] >= d.n) toast('Задание выполнено! Забери награду во вкладке «Бонусы»'); }); if (changed){ store.set('quests', Q); updateDots(); if (shopOpen && tabNow === 'bonus') renderBonus(); } } };
const toastEl = $('toast'); let toastT;
function toast(s){ toastEl.textContent = s; toastEl.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => toastEl.classList.remove('on'), 2800); }
const tabsEl = $('shop-tabs');
tabsEl.addEventListener('click', e => { const b = e.target.closest('button[data-t]'); if (b) showTab(b.dataset.t); });
function updateDots(){ const flag = canDaily() || questReady(); $('shop-btn').classList.toggle('has', flag); tabsEl.querySelector('[data-t="bonus"]').classList.toggle('has', flag); }
const canDaily = () => DAILY.last !== todayStr();
function curStreak(){ if (!DAILY.last) return 0; return dn(todayStr()) - dn(DAILY.last) <= 1 ? DAILY.streak : 0; }
function rollStars(){ const w = [30, 28, 22, 13, 7]; let r = Math.random() * 100, i = 0; while (i < 4 && r >= w[i]){ r -= w[i]; i++; } return i + 1; }
function rollDrop(){ if (Math.random() >= DROP_CHANCE) return null; const pool = WEAR.filter(w => w.slot !== 'color' && w.price <= DROP_MAX_PRICE && !OWNED[w.id]); return pool.length ? pool[R(pool.length)] : null; }
function claimDaily(){ if (!canDaily()) return; const today = todayStr(); const cont = DAILY.last && dn(today) - dn(DAILY.last) === 1; DAILY = { last: today, streak: cont ? DAILY.streak + 1 : 1 }; store.set('daily', DAILY); const stars = rollStars(), drop = rollDrop(); BAL += stars; store.set('bal', BAL); lastResult = `Получено: +${stars} ★` + (drop ? `. Выпал аксессуар «${drop.name}»! Он уже в гардеробе.` : ''); if (drop){ OWNED[drop.id] = true; store.set('owned', OWNED); sfx('fanfare'); renderWear(); } else sfx('cash'); renderBal(); renderBonus(); updateDots(); }
function claimQuest(id){ ensureQuests(); const d = QDEF[id]; if (!d || Q.claimed[id] || (Q.prog[id] || 0) < d.n) return; Q.claimed[id] = true; store.set('quests', Q); BAL += d.r; store.set('bal', BAL); sfx('cash'); renderBal(); renderBonus(); updateDots(); }
function untilMidnight(){ const n = new Date(), m = new Date(n.getFullYear(), n.getMonth(), n.getDate() + 1); const s = Math.max(0, Math.floor((m - n) / 1000)); return Math.floor(s / 3600) + ' ч ' + Math.floor(s % 3600 / 60) + ' мин'; }
function renderBonus(){ ensureQuests(); const can = canDaily(), cs = curStreak(); const done = DAILY.last === todayStr() ? ((DAILY.streak - 1) % 7) + 1 : cs % 7; let week = ''; for (let i = 0; i < 7; i++) week += `<div class="wd ${i < done ? 'f' : (i === done && can ? 't' : '')}">${i + 1}</div>`; const quests = Q.list.map(id => { const d = QDEF[id], p = Q.prog[id] || 0, ok = p >= d.n, got = !!Q.claimed[id]; const btn = got ? '<button class="txtbtn" disabled>Получено</button>' : `<button class="txtbtn ${ok ? 'on' : ''}" data-q="${id}" ${ok ? '' : 'disabled'}>Забрать</button>`; return `<div class="q"><div class="qi"><div class="qt">${d.t}</div><div class="bar"><i style="width:${Math.round(p / d.n * 100)}%"></i></div><div class="qr">${p}/${d.n} · награда ★ ${d.r}</div></div>${btn}</div>`; }).join(''); bonusEl.innerHTML = `<div class="bcard"><div class="bt">Ежедневная награда</div><div class="bs">Заходи каждый день и забирай звёзды. Серия: ${cs} дн. Награда: от 1 до 5 ★.</div><div class="week">${week}</div><button class="txtbtn ${can ? 'on' : ''}" id="claim-d" style="width:100%" ${can ? '' : 'disabled'}>${can ? 'Забрать награду' : 'Приходи завтра'}</button><div class="res">${lastResult}</div></div><div class="bcard"><div class="bt">Задания на сегодня</div><div class="bs">Три задания каждый день. Новые появятся через ${untilMidnight()}.</div>${quests}</div><div class="hint">Звёзды из бонусов можно потратить на наряды.</div>`; }
$('bonus-list').addEventListener('click', e => { if (e.target.closest('#claim-d')) return claimDaily(); const b = e.target.closest('button[data-q]'); if (b) claimQuest(b.dataset.q); });

/* --- Магазин --- */
const SHOP_ITEMS = [ { id: 'astro', char: 'astro', name: 'Космонавт', desc: 'Прилетает на тарелке и говорит загадками о звёздах и невесомости. Если написать «смотри пришельцы», начнётся перестрелка.', price: 299 } ];
const shop = $('shop');
const findItem = id => byId[id] || SHOP_ITEMS.find(i => i.id === id);
const balEl = $('bal-el');
const bonusEl = $('bonus-list');
function renderBal(){ balEl.textContent = '★ ' + BAL; }
function showTab(t){ tabNow = t; tabsEl.querySelectorAll('button').forEach(b => b.classList.toggle('on', b.dataset.t === t)); $('shop-list').style.display = t === 'shop' ? '' : 'none'; bonusEl.style.display = t === 'bonus' ? 'flex' : 'none'; if (t === 'bonus') renderBonus(); }
function renderChars(){ $('chars').innerHTML = SHOP_ITEMS.map(it => { const owned = !!OWNED[it.id], on = owned && char === it.char; const btn = !owned ? `<button class="txtbtn" data-act="buy" data-id="${it.id}">Купить за ★ ${it.price}</button>` : on ? `<button class="txtbtn on" data-act="off" data-id="${it.id}">Снять</button>` : `<button class="txtbtn" data-act="on" data-id="${it.id}">Надеть</button>`; return `<div class="card"><svg viewBox="-85 -140 170 175" style="--su:#EEF3FA;--lc:#FFD166" role="img" aria-label="${it.name}"><use href="#ast"/></svg><div class="info"><div class="name">${it.name}</div><div class="desc">${it.desc}</div><div class="price">★ ${it.price}</div>${btn}</div></div>`; }).join(''); }
$('chars').addEventListener('click', e => { const b = e.target.closest('button[data-act]'); if (!b) return; const it = SHOP_ITEMS.find(i => i.id === b.dataset.id); if (!it) return; if (b.dataset.act === 'buy') buy(it.id); if (b.dataset.act === 'on'){ closeShop(); setChar(it.char); } if (b.dataset.act === 'off'){ closeShop(); setChar('holo'); } });
let tab = 'head', selW = null, pvEq = {};
function renderWear(){ if (!selW || byId[selW].slot !== tab) selW = EQUIP[tab] || WEAR.find(i => i.slot === tab).id; const it = byId[selW]; const slotInfo = SLOTS.find(s => s.k === it.slot); pvEq = Object.assign({}, EQUIP, { [it.slot]: it.id }); dress('p', pvEq); $('w-tabs').innerHTML = SLOTS.map(s => `<button class="txtbtn ${s.k === tab ? 'on' : ''}" data-tab="${s.k}">${s.n}</button>`).join(''); $('w-grid').innerHTML = WEAR.filter(i => i.slot === tab).map(i => { const worn = EQUIP[i.slot] === i.id, own = !!OWNED[i.id]; const tag = worn ? 'Надето' : own ? 'Куплено' : '★ ' + i.price; return `<div class="gi ${i.id === selW ? 'sel' : ''}" data-w="${i.id}"><span class="dot" style="background:${i.sw}"></span><div>${i.name}</div><div class="${own ? 'own' : 'pr'}">${tag}</div></div>`; }).join(''); const own = !!OWNED[it.id], worn = EQUIP[it.slot] === it.id; $('w-name').textContent = it.name; $('w-desc').textContent = slotInfo.d; $('w-price').textContent = own ? (worn ? 'Надето' : 'Куплено') : '★ ' + it.price; const b = $('w-btn'); b.dataset.id = it.id; b.dataset.act = !own ? 'buy' : worn ? 'off' : 'on'; b.textContent = !own ? `Купить за ★ ${it.price}` : worn ? 'Снять' : 'Надеть'; b.className = 'txtbtn' + (worn ? ' on' : ''); $('w-note').textContent = char === 'astro' ? 'Наряды надеваются на голограмму. Чтобы увидеть её в чате, сними космонавта.' : ''; }
function pvColor(t){ const it = pvEq.color && byId[pvEq.color]; let c = '#4FD1E8', s = '#9AF0FF'; if (it && it.rainbow){ c = `rgb(${hsl((t / 20) % 360, .75, .62)})`; s = `rgb(${hsl((t / 20 + 30) % 360, .9, .8)})`; } else if (it){ c = it.c; s = it.s; } $('pvs').style.setProperty('--c', c); $('pvs').style.setProperty('--s', s); }
$('w-tabs').addEventListener('click', e => { const b = e.target.closest('button[data-tab]'); if (!b) return; tab = b.dataset.tab; selW = null; renderWear(); });
$('w-grid').addEventListener('click', e => { const c = e.target.closest('.gi'); if (!c) return; selW = c.dataset.w; Quest.add('try'); renderWear(); });
$('w-btn').addEventListener('click', () => { const id = $('w-btn').dataset.id, act = $('w-btn').dataset.act, it = byId[id]; if (!it) return; if (act === 'buy'){ buy(id); return; } EQUIP[it.slot] = act === 'on' ? id : null; store.set('equip', EQUIP); applyOutfit(); renderWear(); });
function grant(id){ OWNED[id] = true; store.set('owned', OWNED); const w = byId[id]; if (w){ EQUIP[w.slot] = id; store.set('equip', EQUIP); applyOutfit(); renderWear(); Snd.cash(); Quest.add('buy'); return; } const it = SHOP_ITEMS.find(i => i.id === id); if (it){ closeShop(); setChar(it.char); Snd.cash(); Quest.add('buy'); } }
async function buy(id){ const it = findItem(id); if (!it) return; const isSkin = !!SHOP_ITEMS.find(i => i.id === id); if ((!isSkin || BONUS_CAN_BUY_SKINS) && BAL >= it.price){ BAL -= it.price; store.set('bal', BAL); renderBal(); grant(id); return; } if (DEMO_BUY){ grant(id); return; } try { const r = await fetch(`${BACKEND_URL}/invoice`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ item: id, user_id: userId() }) }); const data = await r.json(); if (!data.link) throw new Error('нет ссылки на оплату'); tg.openInvoice(data.link, status => { if (status === 'paid') grant(id); }); } catch (e) { addToHistory(`Не получилось открыть оплату: ${e.message}`, 'bot'); closeShop(); } }
function openShop(){ Quest.add('shop'); renderChars(); renderWear(); renderBal(); showTab('shop'); shopOpen = true; shop.classList.add('open'); if (tg && tg.BackButton){ tg.BackButton.show(); tg.BackButton.onClick(closeShop); } }
function closeShop(){ shopOpen = false; shop.classList.remove('open'); if (tg && tg.BackButton){ tg.BackButton.hide(); tg.BackButton.offClick(closeShop); } }
$('shop-btn').addEventListener('click', openShop); $('shop-close').addEventListener('click', closeShop);
const q = new URLSearchParams(location.search);
applyOutfit(); if (q.get('emotion')) Hologram.emotion(q.get('emotion')); setChar(char);
setTimeout(() => { Hologram.react('happy', 'wave', 3500); const hour = new Date().getHours(); let greeting = GREET[char]; if (chatHistoryForServer.length === 0) { if (hour >= 5 && hour < 12) greeting = "Доброе утро! Как спалось?"; else if (hour >= 12 && hour < 18) greeting = "Добрый день! Чем займемся?"; else if (hour >= 18 && hour < 23) greeting = "Добрый вечер! Как прошел день?"; else greeting = "Ты чего не спишь? Давай поболтаем."; } addToHistory(greeting, 'bot'); }, 500);

/* Переключатель звуков */
const sndBtn = $('snd-btn');
const ICON_ON  = '<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H3v6h3l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></svg>';
const ICON_OFF = '<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H3v6h3l5 4V5z"/><path d="M16 9l5 6M21 9l-5 6"/></svg>';
function drawSnd(){ sndBtn.innerHTML = Snd.on() ? ICON_ON : ICON_OFF; sndBtn.classList.toggle('muted', !Snd.on()); sndBtn.setAttribute('aria-label', Snd.on() ? 'Выключить звуки' : 'Включить звуки'); }
sndBtn.addEventListener('click', () => { Snd.set(!Snd.on()); drawSnd(); }); drawSnd();

/* Старт */
ensureQuests(); renderBal(); updateDots();
setTimeout(() => { if (canDaily()) toast('Тебя ждёт ежедневная награда: магазин → «Бонусы»'); }, 2500);
</script>
</body>
