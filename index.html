<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Голограмма-бот</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
    body { margin: 0; background: #0E1726; color: #C8F8FF; font-family: sans-serif; display: flex; flex-direction: column; height: 100vh; }
    #chat { flex: 1; overflow-y: auto; padding: 10px; display: flex; flex-direction: column; gap: 10px; }
    .msg { padding: 8px 12px; border-radius: 8px; max-width: 80%; }
    .msg.user { align-self: flex-end; background: #163B57; border: 1px solid #4FD1E8; }
    .msg.bot { align-self: flex-start; background: #10202F; border: 1px solid #2E8FA3; }
    #panel { padding: 10px; background: #0B2230; border-top: 1px solid #2E8FA3; display: flex; gap: 8px; }
    #input { flex: 1; padding: 10px; background: #0d1117; border: 1px solid #4FD1E8; color: #fff; border-radius: 4px; }
    #send { padding: 10px 20px; background: #4FD1E8; border: none; color: #000; border-radius: 4px; cursor: pointer; }
</style>
</head>
<body>
<div id="chat"></div>
<div id="panel">
    <input id="input" type="text" placeholder="Напиши сообщение...">
    <button id="send">Отправить</button>
</div>
<script>
    const BACKEND_URL = 'https://ai-friend-brain.onrender.com';
    const tg = window.Telegram && Telegram.WebApp;
    if (tg) { tg.ready(); tg.expand(); }

    const chat = document.getElementById('chat');
    const input = document.getElementById('input');
    const sendBtn = document.getElementById('send');

    function addMsg(text, sender) {
        const div = document.createElement('div');
        div.className = 'msg ' + sender;
        div.textContent = text;
        chat.appendChild(div);
        chat.scrollTop = chat.scrollHeight;
    }

    async function sendMessage() {
        const text = input.value.trim();
        if (!text) return;
        input.value = '';
        addMsg(text, 'user');
        sendBtn.disabled = true;

        try {
            const res = await fetch(`${BACKEND_URL}/ask`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    text: text,
                    persona: 'hologram',
                    init_data: (tg && tg.initData) || ''
                })
            });
            const data = await res.json();
            addMsg(data.text || 'Ошибка ответа', 'bot');
        } catch (e) {
            addMsg('Ошибка соединения с сервером', 'bot');
        } finally {
            sendBtn.disabled = false;
        }
    }

    sendBtn.addEventListener('click', sendMessage);
    input.addEventListener('keypress', (e) => { if (e.key === 'Enter') sendMessage(); });
    
    addMsg('Привет! Я твой голо-друг. Давай поболтаем?', 'bot');
</script>
</body>
</html>
