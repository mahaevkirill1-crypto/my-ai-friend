<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ИИ-Друг</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            /* Принудительно черная тема */
            --bg-color: #000000; 
            --bot-msg-bg: #1c1c1e; 
            --user-msg-bg: #007aff; 
            --text-color: #ffffff;
            --input-bg: #1c1c1e;
            --hint-color: #8e8e93;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0; padding: 0;
            display: flex; flex-direction: column; height: 100vh; box-sizing: border-box;
            overflow: hidden;
        }

        /* Шапка с персонажем */
        #character-area {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 15px 0;
            background: radial-gradient(circle at center, rgba(0,122,255,0.15) 0%, rgba(0,0,0,0) 70%);
        }

        .character {
            width: 70px;
            height: 70px;
            background-color: #1c1c1e;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 40px;
            border: 2px solid #007aff;
            box-shadow: 0 0 20px rgba(0, 122, 255, 0.3);
            animation: breathe 3s ease-in-out infinite;
        }

        @keyframes breathe {
            0%, 100% { transform: scale(1); box-shadow: 0 0 20px rgba(0, 122, 255, 0.3); }
            50% { transform: scale(1.05); box-shadow: 0 0 30px rgba(0, 122, 255, 0.6); }
        }

        /* Чат */
        #chat {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            scroll-behavior: smooth;
        }

        .message {
            padding: 10px 14px;
            border-radius: 18px;
            max-width: 80%;
            word-wrap: break-word;
            line-height: 1.4;
            font-size: 15px;
            animation: slideIn 0.3s ease-out forwards;
            opacity: 0;
            transform: translateY(10px);
        }

        @keyframes slideIn {
            to { opacity: 1; transform: translateY(0); }
        }

        .message.user {
            background-color: var(--user-msg-bg);
            color: var(--text-color);
            align-self: flex-end;
            border-bottom-right-radius: 4px;
        }

        .message.bot {
            background-color: var(--bot-msg-bg);
            color: var(--text-color);
            align-self: flex-start;
            border-bottom-left-radius: 4px;
        }

        /* Зона ввода */
        #input-area {
            display: flex;
            gap: 10px;
            padding: 12px 16px;
            background-color: var(--bg-color);
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            padding-bottom: max(12px, env(safe-area-inset-bottom)); /* Учет нижней панели iPhone */
        }

        #user-input {
            flex: 1;
            padding: 12px 16px;
            border-radius: 20px;
            border: none;
            background: var(--input-bg);
            color: var(--text-color);
            font-size: 15px;
            outline: none;
        }

        #user-input::placeholder {
            color: var(--hint-color);
        }

        #send-btn {
            padding: 0 20px;
            border-radius: 20px;
            border: none;
            background: #007aff;
            color: #ffffff;
            font-size: 18px;
            cursor: pointer;
            transition: opacity 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #send-btn:active {
            opacity: 0.8;
        }
    </style>
</head>
<body>
    <!-- Персонаж -->
    <div id="character-area">
        <div class="character" id="character-avatar">🤖</div>
    </div>

    <!-- Чат -->
    <div id="chat">
        <div class="message bot">Привет. Я тут. С чего начнём?</div>
    </div>

    <!-- Ввод -->
    <div id="input-area">
        <input type="text" id="user-input" placeholder="Напиши сообщение..." autocomplete="off">
        <button id="send-btn">➤</button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();
        
        // Красим системные элементы Telegram в черный
        tg.setHeaderColor('#000000');
        tg.setBackgroundColor('#000000');

        const chat = document.getElementById('chat');
        const input = document.getElementById('user-input');
        const sendBtn = document.getElementById('send-btn');
        const avatar = document.getElementById('character-avatar');

        const BACKEND_URL = 'https://ai-friend-brain.onrender.com';

        function addMessage(text, sender) {
            const div = document.createElement('div');
            div.className = `message ${sender}`;
            div.style.opacity = '0';
            chat.appendChild(div);

            if (sender === 'user') {
                div.textContent = text;
                div.style.opacity = '1';
            } else {
                let i = 0;
                const speed = 25;
                function typeWriter() {
                    if (i < text.length) {
                        div.textContent += text.charAt(i);
                        i++;
                        chat.scrollTop = chat.scrollHeight;
                        setTimeout(typeWriter, speed);
                    }
                }
                typeWriter();
            }
            chat.scrollTop = chat.scrollHeight;
        }

        function setCharacterEmotion(emotion) {
            if (emotion === 'happy') avatar.textContent = '😊';
            else if (emotion === 'sad') avatar.textContent = '😔';
            else if (emotion === 'think') avatar.textContent = '🤔';
            else avatar.textContent = '🤖';
        }

        async function sendMessage() {
            const text = input.value.trim();
            if (!text) return;

            addMessage(text, 'user');
            input.value = '';
            input.disabled = true;
            sendBtn.disabled = true;
            
            setCharacterEmotion('think');

            try {
                const response = await fetch(`${BACKEND_URL}/ask`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        text: text,
                        user_id: tg.initDataUnsafe?.user?.id || 'test_user' 
                    })
                });

                if (!response.ok) throw new Error(`Сервер ответил: ${response.status}`);
                
                const data = await response.json();
                setCharacterEmotion('idle');
                addMessage(data.text, 'bot');

            } catch (error) {
                setCharacterEmotion('sad');
                addMessage(`ОШИБКА СЕТИ: ${error.message}`, 'bot');
            } finally {
                input.disabled = false;
                sendBtn.disabled = false;
                input.focus();
            }
        }

        sendBtn.addEventListener('click', sendMessage);
        input.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendMessage();
        });
    </script>
</body>
</html>
