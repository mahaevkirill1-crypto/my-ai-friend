<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ИИ-Друг</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: #0d1117; 
            --bot-msg-bg: #1c2533; 
            --user-msg-bg: #2b5278; 
            --text-color: #ffffff;
            --accent-color: #58a6ff; 
            --hud-border: 2px solid #58a6ff;
        }

        * { box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: radial-gradient(circle at top, #1a2433 0%, var(--bg-color) 100%);
            color: var(--text-color);
            margin: 0; padding: 0;
            display: flex; flex-direction: column; height: 100vh; overflow: hidden;
        }

        /* Зона с персонажем */
        #character-area {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            padding-top: 10px;
        }

        .character-container {
            position: relative;
            animation: float 4s ease-in-out infinite;
            display: flex;
            flex-direction: column;
            align-items: center;
            max-width: 90%;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        .character-img {
            width: 220px;
            max-width: 70vw;
            height: auto;
            filter: drop-shadow(0 15px 25px rgba(88, 166, 255, 0.2));
            transition: opacity 0.3s ease;
        }

        /* Стеклянное облачко */
        .speech-bubble {
            background: rgba(28, 37, 51, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(88, 166, 255, 0.4);
            color: #e6edf3;
            padding: 12px 18px;
            border-radius: 16px;
            border-bottom-left-radius: 4px;
            font-size: 15px;
            line-height: 1.4;
            margin-bottom: 20px;
            max-width: 100%;
            box-shadow: 0 8px 32px rgba(0,0,0,0.5);
            display: none;
            animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
            position: relative;
            z-index: 10;
        }

        .speech-bubble::after {
            content: '';
            position: absolute;
            bottom: -8px; left: 20px;
            width: 16px; height: 16px;
            background: rgba(28, 37, 51, 0.7);
            border-bottom: 1px solid rgba(88, 166, 255, 0.4);
            border-left: 1px solid rgba(88, 166, 255, 0.4);
            transform: rotate(-45deg);
        }

        @keyframes popIn {
            0% { opacity: 0; transform: scale(0.9) translateY(15px); }
            100% { opacity: 1; transform: scale(1) translateY(0); }
        }

        /* История чата */
        #chat-history {
            height: 25vh; /* Уменьшили, чтобы влезли кнопки */
            overflow-y: auto;
            padding: 10px 16px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            z-index: 20;
        }

        .msg-row {
            display: flex; align-items: flex-end; gap: 8px; max-width: 85%;
            animation: slideIn 0.3s ease-out forwards; opacity: 0; transform: translateY(10px);
        }
        .msg-row.user { align-self: flex-end; flex-direction: row-reverse; }
        .msg-row.bot { align-self: flex-start; }
        @keyframes slideIn { to { opacity: 1; transform: translateY(0); } }

        .avatar {
            width: 26px; height: 26px; border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 14px; background: var(--bot-msg-bg); flex-shrink: 0;
        }
        .msg-row.user .avatar { background: var(--user-msg-bg); }
        .message { padding: 10px 14px; border-radius: 16px; font-size: 14px; line-height: 1.4; }
        .msg-row.user .message { background-color: var(--user-msg-bg); border-bottom-right-radius: 4px; }
        .msg-row.bot .message { background-color: var(--bot-msg-bg); border-bottom-left-radius: 4px; }

        /* --- НОВЫЙ БЛОК: HUD Интерфейс --- */
        #hud-panel {
            padding: 0 16px 16px 16px;
            background: var(--bg-color);
            display: flex;
            flex-direction: column;
            gap: 12px;
            z-index: 20;
        }

        /* Скошенная рамка для ввода (как на референсе) */
        .input-wrapper {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .mic-btn {
            width: 44px; height: 44px;
            border-radius: 10px;
            background: transparent;
            border: 1px solid rgba(88, 166, 255, 0.3);
            color: var(--accent-color);
            display: flex; justify-content: center; align-items: center;
            font-size: 18px;
            cursor: pointer;
        }

        .input-container {
            flex: 1;
            display: flex;
            align-items: center;
            background: #0d1117;
            border: 1px solid var(--accent-color);
            border-radius: 8px;
            position: relative;
            /* Скошенные углы */
            clip-path: polygon(10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%, 0 10px);
            padding: 4px;
        }

        #user-input {
            flex: 1;
            background: transparent;
            border: none;
            color: var(--text-color);
            padding: 10px 12px;
            font-size: 15px;
            outline: none;
        }

        #user-input::placeholder { color: var(--hint-color); }

        #send-btn {
            width: 40px; height: 40px;
            background: var(--accent-color);
            border: none;
            border-radius: 6px;
            color: #000;
            font-size: 18px;
            display: flex; justify-content: center; align-items: center;
            cursor: pointer;
            margin-right: 2px;
        }
        #send-btn:active { transform: scale(0.95); }

        /* Кнопки быстрых действий */
        .quick-actions {
            display: flex;
            gap: 8px;
            overflow-x: auto; /* Скролл, если не влезут */
            padding-bottom: 5px;
            scrollbar-width: none; /* Скрыть скроллбар */
        }
        .quick-actions::-webkit-scrollbar { display: none; }

        .quick-btn {
            background: rgba(28, 37, 51, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #e6edf3;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 14px;
            white-space: nowrap;
            cursor: pointer;
            transition: all 0.2s;
        }

        .quick-btn:active {
            background: rgba(88, 166, 255, 0.2);
            border-color: var(--accent-color);
        }
    </style>
</head>
<body>
    <!-- Зона с роботом -->
    <div id="character-area">
        <div class="character-container">
            <div class="speech-bubble" id="speech-bubble"></div>
            <img src="IMG_1209.png?v=4" alt="Robot" class="character-img" id="character-img">
        </div>
    </div>

    <!-- История чата -->
    <div id="chat-history"></div>

    <!-- НИЖНЯЯ ПАНЕЛЬ (HUD) -->
    <div id="hud-panel">
        <!-- Кнопки быстрых вопросов -->
        <div class="quick-actions">
            <button class="quick-btn" onclick="quickSend('Привет')">Привет</button>
            <button class="quick-btn" onclick="quickSend('Рассмеши меня')">Рассмеши меня</button>
            <button class="quick-btn" onclick="quickSend('Станцуй')">Станцуй</button>
        </div>

        <!-- Поле ввода со скошенными углами -->
        <div class="input-wrapper">
            <button class="mic-btn">🎤</button>
            <div class="input-container">
                <input type="text" id="user-input" placeholder="Напиши сообщение..." autocomplete="off">
                <button id="send-btn">➤</button>
            </div>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();
        tg.setHeaderColor('#0d1117');
        tg.setBackgroundColor('#0d1117');

        const chatHistory = document.getElementById('chat-history');
        const input = document.getElementById('user-input');
        const sendBtn = document.getElementById('send-btn');
        const speechBubble = document.getElementById('speech-bubble');
        const characterImg = document.getElementById('character-img');

        const BACKEND_URL = 'https://ai-friend-brain.onrender.com';

        function showBubble(text) {
            speechBubble.style.display = 'block';
            speechBubble.textContent = '';
            let i = 0;
            function typeWriter() {
                if (i < text.length) {
                    speechBubble.textContent += text.charAt(i);
                    i++;
                    setTimeout(typeWriter, 20); // Ускорил печать
                }
            }
            typeWriter();
        }

        function addToHistory(text, sender) {
            const row = document.createElement('div');
            row.className = `msg-row ${sender}`;
            const avatar = document.createElement('div');
            avatar.className = 'avatar';
            avatar.textContent = sender === 'user' ? '👤' : '🤖';
            const msg = document.createElement('div');
            msg.className = 'message';
            msg.textContent = text;
            row.appendChild(avatar);
            row.appendChild(msg);
            chatHistory.appendChild(row);
            chatHistory.scrollTop = chatHistory.scrollHeight;
        }

        async function sendMessage(text) {
            if (!text) return;

            addToHistory(text, 'user');
            input.value = '';
            input.disabled = true;
            sendBtn.disabled = true;
            
            characterImg.style.opacity = '0.5';

            try {
                const response = await fetch(`${BACKEND_URL}/ask`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ text: text })
                });

                if (!response.ok) throw new Error(`Сервер ответил: ${response.status}`);
                
                const data = await response.json();
                
                characterImg.style.opacity = '1';
                showBubble(data.text); 
                addToHistory(data.text, 'bot');

            } catch (error) {
                characterImg.style.opacity = '1';
                showBubble(`Ошибка: ${error.message}`);
                addToHistory(`Ошибка: ${error.message}`, 'bot');
            } finally {
                input.disabled = false;
                sendBtn.disabled = false;
                input.focus();
            }
        }

        // Обработка кнопок
        sendBtn.addEventListener('click', () => sendMessage(input.value.trim()));
        
        input.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendMessage(input.value.trim());
        });

        // Функция для кнопок быстрых действий
        window.quickSend = function(text) {
            sendMessage(text);
        };

        setTimeout(() => showBubble("Привет! Как дела?"), 500);
    </script>
</body>
</html>
