<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ИИ-Друг</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: #0d1117; 
            --bot-msg-bg: #1c2533; 
            --user-msg-bg: #2b5278; 
            --text-color: #ffffff;
            --accent-color: #58a6ff; /* Голубой цвет */
            --yellow-accent: #f1c40f; /* Желтый акцент с референса */
            --user-color: #2b5278;
        }

        * { box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: radial-gradient(circle at top, #1a2433 0%, var(--bg-color) 100%);
            color: var(--text-color);
            margin: 0; padding: 0;
            display: flex; flex-direction: column; height: 100vh; overflow: hidden;
        }

        /* Верхняя часть с роботом */
        #top-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            align-items: center;
            position: relative;
            padding-top: 20px;
            padding-bottom: 10px;
            min-height: 35vh;
        }

        .character-container {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            max-width: 95%;
            width: 100%;
        }

        .character-img {
            width: 240px; 
            max-width: 70vw;
            height: auto;
            filter: drop-shadow(0 15px 25px rgba(88, 166, 255, 0.2));
            transition: opacity 0.3s ease;
            animation: float 4s ease-in-out infinite;
            flex-shrink: 0;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        /* --- Новое облачко со скошенными углами --- */
        .speech-bubble {
            position: relative;
            background: #0f1822;
            border: 2px solid var(--accent-color);
            padding: 14px 22px;
            margin-bottom: 25px;
            max-width: 90%;
            font-size: 15px;
            line-height: 1.5;
            color: #e6edf3;
            display: none;
            animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
            /* Скошенные углы с помощью clip-path */
            clip-path: polygon(15px 0, 100% 0, 100% calc(100% - 15px), calc(100% - 15px) 100%, 0 100%, 0 15px);
            z-index: 10;
            max-height: 30vh;
            overflow-y: auto;
        }

        /* Хвостик облачка (треугольник вниз) */
        .speech-bubble::after {
            content: '';
            position: absolute;
            bottom: -12px;
            left: 50%;
            transform: translateX(-50%);
            width: 0; height: 0;
            border-left: 10px solid transparent;
            border-right: 10px solid transparent;
            border-top: 12px solid var(--accent-color);
        }

        /* Закрашиваем хвостик изнутри, чтобы он был полым */
        .speech-bubble::before {
            content: '';
            position: absolute;
            bottom: -9px;
            left: 50%;
            transform: translateX(-50%);
            width: 0; height: 0;
            border-left: 8px solid transparent;
            border-right: 8px solid transparent;
            border-top: 10px solid #0f1822;
            z-index: 1;
        }

        /* Желтые акценты на углах (имитация референса) */
        .corner-accent {
            position: absolute;
            width: 15px; height: 15px;
            border: 2px solid var(--yellow-accent);
            pointer-events: none;
        }
        .corner-accent.top-left {
            top: 0; left: 0;
            border-right: none; border-bottom: none;
            clip-path: polygon(0 0, 100% 0, 100% 2px, 2px 2px, 2px 100%, 0 100%);
        }
        .corner-accent.bottom-right {
            bottom: 0; right: 0;
            border-left: none; border-top: none;
            clip-path: polygon(calc(100% - 2px) 0, 100% 0, 100% 100%, 0 100%, 0 calc(100% - 2px), calc(100% - 2px) calc(100% - 2px));
        }

        /* Стиль для пользователя (если нужно) */
        .speech-bubble.user-bubble {
            border-color: var(--user-color);
            clip-path: none; /* Пользователю можно оставить обычный */
            border-radius: 16px;
        }

        @keyframes popIn {
            0% { opacity: 0; transform: scale(0.9) translateY(15px); }
            100% { opacity: 1; transform: scale(1) translateY(0); }
        }

        /* --- Анимация "Думает" (Три точки) --- */
        .thinking-dots {
            display: flex;
            gap: 6px;
            justify-content: center;
            padding: 10px 0;
        }
        .thinking-dots span {
            width: 10px; height: 10px;
            background-color: var(--accent-color);
            border-radius: 50%;
            animation: bounce 1.4s infinite ease-in-out both;
        }
        .thinking-dots span:nth-child(1) { animation-delay: -0.32s; }
        .thinking-dots span:nth-child(2) { animation-delay: -0.16s; }

        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0); opacity: 0.3; }
            40% { transform: scale(1); opacity: 1; }
        }

        /* История чата */
        #chat-history {
            flex: 0.8;
            overflow-y: auto;
            padding: 10px 16px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            z-index: 20;
            mask-image: linear-gradient(to bottom, transparent, black 10%, black 90%, transparent);
            -webkit-mask-image: linear-gradient(to bottom, transparent, black 10%, black 90%, transparent);
        }

        .msg-row {
            display: flex; align-items: flex-end; gap: 8px; max-width: 85%;
            animation: slideIn 0.3s ease-out forwards; opacity: 0; transform: translateY(10px);
        }
        .msg-row.user { align-self: flex-end; flex-direction: row-reverse; }
        .msg-row.bot { align-self: flex-start; }
        @keyframes slideIn { to { opacity: 1; transform: translateY(0); } }

        .avatar {
            width: 26px; height: 26px; border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 14px; background: var(--bot-msg-bg); flex-shrink: 0;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .msg-row.user .avatar { background: var(--user-msg-bg); }
        .message { padding: 10px 14px; border-radius: 16px; font-size: 14px; line-height: 1.4; word-wrap: break-word; }
        .msg-row.user .message { background-color: var(--user-msg-bg); border-bottom-right-radius: 4px; }
        .msg-row.bot .message { background-color: var(--bot-msg-bg); border-bottom-left-radius: 4px; }

        /* --- HUD Интерфейс (внизу) --- */
        #hud-panel {
            padding: 16px;
            background: var(--bg-color);
            display: flex;
            flex-direction: column;
            gap: 12px;
            z-index: 20;
            padding-bottom: max(16px, env(safe-area-inset-bottom));
            flex-shrink: 0;
            border-top: 1px solid rgba(255,255,255,0.05);
        }

        .input-wrapper {
            display: flex; align-items: center; gap: 10px;
        }

        .mic-btn {
            width: 44px; height: 44px; border-radius: 10px;
            background: transparent; border: 1px solid rgba(88, 166, 255, 0.3);
            color: var(--accent-color); display: flex; justify-content: center; align-items: center;
            font-size: 18px; cursor: pointer;
        }

        .input-container {
            flex: 1; display: flex; align-items: center;
            background: #0d1117; border: 1px solid var(--accent-color);
            border-radius: 8px; position: relative;
            clip-path: polygon(10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%, 0 10px);
            padding: 4px;
        }

        #user-input {
            flex: 1; background: transparent; border: none;
            color: #fff; padding: 10px 12px; font-size: 15px; outline: none;
        }

        #send-btn {
            width: 40px; height: 40px; background: var(--accent-color);
            border: none; border-radius: 6px; color: #000; font-size: 18px;
            display: flex; justify-content: center; align-items: center;
            cursor: pointer; margin-right: 2px;
        }
    </style>
</head>
<body>
    <!-- Верхняя зона с роботом -->
    <div id="top-area">
        <div class="character-container">
            <div class="speech-bubble" id="speech-bubble">
                <!-- Желтые акценты -->
                <div class="corner-accent top-left"></div>
                <div class="corner-accent bottom-right"></div>
                <div id="bubble-content"></div>
            </div>
            <img src="IMG_1209.png?v=6" alt="Robot" class="character-img" id="character-img">
        </div>
    </div>

    <!-- История чата -->
    <div id="chat-history"></div>

    <!-- НИЖНЯЯ ПАНЕЛЬ (HUD) -->
    <div id="hud-panel">
        <div class="input-wrapper">
            <button class="mic-btn">🎤</button>
            <div class="input-container">
                <input type="text" id="user-input" placeholder="Напиши сообщение..." autocomplete="off">
                <button id="send-btn">➤</button>
            </div>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();
        tg.setHeaderColor('#0d1117');
        tg.setBackgroundColor('#0d1117');

        const input = document.getElementById('user-input');
        const sendBtn = document.getElementById('send-btn');
        const speechBubble = document.getElementById('speech-bubble');
        const bubbleContent = document.getElementById('bubble-content');
        const characterImg = document.getElementById('character-img');
        const chatHistory = document.getElementById('chat-history');

        const BACKEND_URL = 'https://ai-friend-brain.onrender.com';
        let isSending = false;

        // Показать текст в облачке
        function showBubble(text, isUser = false) {
            speechBubble.style.display = 'block';
            speechBubble.className = `speech-bubble ${isUser ? 'user-bubble' : ''}`;
            speechBubble.style.animation = 'none';
            void speechBubble.offsetWidth;
            speechBubble.style.animation = 'popIn 0.3s forwards';
            
            bubbleContent.textContent = '';
            
            if (isUser) {
                bubbleContent.textContent = text;
            } else {
                let i = 0;
                function typeWriter() {
                    if (i < text.length) {
                        bubbleContent.textContent += text.charAt(i);
                        i++;
                        bubbleContent.scrollTop = bubbleContent.scrollHeight;
                        setTimeout(typeWriter, 20);
                    }
                }
                typeWriter();
            }
        }

        // Показать анимацию "Думает"
        function showThinking() {
            speechBubble.style.display = 'block';
            speechBubble.className = 'speech-bubble';
            speechBubble.style.animation = 'none';
            void speechBubble.offsetWidth;
            speechBubble.style.animation = 'popIn 0.3s forwards';
            
            bubbleContent.innerHTML = `
                <div class="thinking-dots">
                    <span></span><span></span><span></span>
                </div>
            `;
        }

        function addToHistory(text, sender) {
            const row = document.createElement('div');
            row.className = `msg-row ${sender}`;
            const avatar = document.createElement('div');
            avatar.className = 'avatar';
            avatar.textContent = sender === 'user' ? '👤' : '🤖';
            const msg = document.createElement('div');
            msg.className = 'message';
            msg.textContent = text;
            row.appendChild(avatar);
            row.appendChild(msg);
            chatHistory.appendChild(row);
            chatHistory.scrollTop = chatHistory.scrollHeight;
        }

        async function sendMessage(text) {
            if (!text || isSending) return;
            isSending = true;

            showBubble(text, true);
            addToHistory(text, 'user');
            input.value = '';
            input.disabled = true;
            sendBtn.disabled = true;
            
            characterImg.style.opacity = '0.5';

            // Задержка перед показом "Думает" (чтобы пользователь прочитал свой текст)
            setTimeout(async () => {
                showThinking(); // Включаем три точки
                
                try {
                    const response = await fetch(`${BACKEND_URL}/ask`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ text: text })
                    });

                    if (!response.ok) throw new Error(`Сервер ответил: ${response.status}`);
                    
                    const data = await response.json();
                    
                    characterImg.style.opacity = '1';
                    showBubble(data.text, false); 
                    addToHistory(data.text, 'bot');

                } catch (error) {
                    characterImg.style.opacity = '1';
                    showBubble(`Ошибка: ${error.message}`, false);
                    addToHistory(`Ошибка: ${error.message}`, 'bot');
                } finally {
                    input.disabled = false;
                    sendBtn.disabled = false;
                    input.focus();
                    isSending = false; 
                }
            }, 800);
        }

        sendBtn.addEventListener('click', () => sendMessage(input.value.trim()));
        input.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendMessage(input.value.trim());
        });

        // Приветствие при загрузке
        setTimeout(() => showBubble("Привет! Я твой голо-друг. Давай поболтаем?"), 500);
    </script>
</body>
</html>
